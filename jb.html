<!doctype html>
<html lang="en" manifest="cache.appcache">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <title>HOST:PERRUNOGT</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap');

    :root {
      --bg: #020504;
      --panel: rgba(4, 14, 9, 0.88);
      --green: #00ff88;
      --green2: #00c96b;
      --green3: #65ffb3;
      --text: #eafff3;
      --muted: #537565;
      --red: #ff365e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      position: relative;
      overflow: hidden;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        radial-gradient(
          ellipse at center,
          rgba(0, 255, 136, 0.10),
          transparent 40%
        ),
        radial-gradient(
          ellipse at 20% 90%,
          rgba(0, 255, 136, 0.05),
          transparent 35%
        ),
        #020504;

      color: var(--text);
      font-family: 'Inter', sans-serif;
    }

    body::before {
      content: "";

      position: absolute;
      inset: 0;

      background-image:
        linear-gradient(
          rgba(0,255,136,0.025) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(0,255,136,0.025) 1px,
          transparent 1px
        );

      background-size: 40px 40px;

      mask-image:
        linear-gradient(
          to bottom,
          transparent,
          black 25%,
          black 75%,
          transparent
        );

      pointer-events: none;
    }

    body::after {
      content: "";

      position: absolute;

      width: 480px;
      height: 480px;

      background: rgba(0,255,136,0.045);

      filter: blur(90px);

      pointer-events: none;
    }

    #main-container {
      position: relative;

      width: min(88vw, 440px);
      height: min(88vw, 440px);

      min-width: 290px;
      min-height: 290px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      background: var(--panel);

      border: 1px solid rgba(0,255,136,0.22);

      border-radius: 30px;

      box-shadow:
        0 25px 90px rgba(0,0,0,0.75),
        0 0 70px rgba(0,255,136,0.07),
        inset 0 0 45px rgba(0,255,136,0.025);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      transition:
        border-color .4s ease,
        box-shadow .4s ease;
    }

    #main-container::before,
    #main-container::after {
      content: "";

      position: absolute;

      width: 42px;
      height: 42px;

      border-color: var(--green);

      opacity: .75;
    }

    #main-container::before {
      top: -1px;
      left: -1px;

      border-top: 2px solid;
      border-left: 2px solid;

      border-radius: 30px 0 0 0;
    }

    #main-container::after {
      right: -1px;
      bottom: -1px;

      border-right: 2px solid;
      border-bottom: 2px solid;

      border-radius: 0 0 30px 0;
    }

    #brand {
      position: absolute;

      top: 38px;

      font-family: 'JetBrains Mono', monospace;

      font-size: clamp(17px, 5vw, 23px);

      font-weight: 800;

      letter-spacing: .13em;

      color: white;

      text-shadow:
        0 0 8px rgba(0,255,136,.8),
        0 0 25px rgba(0,255,136,.25);

      transition: .4s ease;
    }

    #brand::before {
      content: "GOLDHEN HOST";

      display: block;

      margin-bottom: 6px;

      text-align: center;

      font-size: 8px;

      font-weight: 400;

      letter-spacing: .35em;

      color: var(--muted);
    }

    #visual-indicator {

      position: relative;

      width: 190px;
      height: 150px;

      display: flex;

      align-items: center;
      justify-content: center;

      margin-top: 38px;
    }

    

    .core {

      position: relative;

      width: 58px;
      height: 58px;

      border-radius: 14px;

      transform: rotate(45deg);

      background:
        linear-gradient(
          135deg,
          #baffd9,
          var(--green)
        );

      box-shadow:
        0 0 12px var(--green),
        0 0 35px rgba(0,255,136,.75),
        0 0 80px rgba(0,255,136,.30);

      animation: reactor 1.5s ease-in-out infinite;

      z-index: 5;

      transition:
        background .4s ease,
        box-shadow .4s ease,
        transform .4s ease;
    }

    .core::before {

      content: "";

      position: absolute;

      width: 22px;
      height: 22px;

      top: 18px;
      left: 18px;

      background: #effff6;

      box-shadow:
        0 0 15px white,
        0 0 30px var(--green);

      border-radius: 5px;
    }

    #visual-indicator::before,
    #visual-indicator::after {

      content: "";

      position: absolute;

      width: 110px;
      height: 110px;

      border: 1px solid rgba(0,255,136,.25);

      transform: rotate(45deg);

      animation: diamond 3s linear infinite;
    }

    #visual-indicator::after {

      width: 150px;
      height: 150px;

      border-color: rgba(0,255,136,.10);

      animation-duration: 6s;

      animation-direction: reverse;
    }

    #spin {

      position: absolute;

      width: 180px;
      height: 70px;

      border: none;

      opacity: 1;

      animation: none;

      z-index: 2;
    }

    #spin::before,
    #spin::after {

      content: "";

      position: absolute;

      left: 50%;

      width: 180px;
      height: 2px;

      transform: translateX(-50%);

      background:
        linear-gradient(
          90deg,
          transparent,
          var(--green),
          transparent
        );

      box-shadow:
        0 0 8px var(--green);

      animation: energy 1.2s ease-in-out infinite;
    }

    #spin::before {
      top: 8px;
    }

    #spin::after {

      bottom: 8px;

      animation-delay: .6s;
    }

    .pulse {

      position: absolute;

      width: 130px;
      height: 130px;

      border-radius: 18px;

      border: 1px dashed rgba(0,255,136,.22);

      transform: rotate(45deg);

      animation:
        pulseBox 2s ease-in-out infinite;

      transition:
        border-color .4s ease,
        opacity .4s ease;
    }

    body.done #main-container {

      border-color: rgba(0,255,136,.5);

      box-shadow:
        0 25px 90px rgba(0,0,0,.75),
        0 0 100px rgba(0,255,136,.16),
        inset 0 0 55px rgba(0,255,136,.05);
    }

    body.done #brand {

      color: var(--green3);

      text-shadow:
        0 0 12px var(--green),
        0 0 35px rgba(0,255,136,.45);
    }

    body.done #spin {
      opacity: 0;
    }

    body.done .pulse {

      border-color: rgba(0,255,136,.65);

      animation: none;
    }

    body.done .core {

      animation: successCore 1.2s ease-in-out infinite;

      background: var(--green);

      box-shadow:
        0 0 20px var(--green),
        0 0 55px rgba(0,255,136,.85),
        0 0 100px rgba(0,255,136,.35);
    }

    body.fail #main-container {

      border-color: rgba(255,54,94,.45);

      box-shadow:
        0 25px 90px rgba(0,0,0,.75),
        0 0 90px rgba(255,54,94,.12);
    }

    body.fail #brand {

      color: var(--red);

      text-shadow:
        0 0 15px rgba(255,54,94,.8);
    }

    body.fail #spin {
      opacity: 0;
    }

    body.fail .pulse {

      border-color: var(--red);

      animation: none;
    }

    body.fail .core {

      background: var(--red);

      box-shadow:
        0 0 20px var(--red),
        0 0 55px rgba(255,54,94,.7);
    }

    #msg {

      position: fixed;

      left: 50%;
      bottom: 78px;

      transform: translateX(-50%);

      display: none;

      width: 90%;

      text-align: center;

      font-family: 'JetBrains Mono', monospace;

      font-size: 11px;

      letter-spacing: .18em;

      color: var(--red);

      text-shadow:
        0 0 12px rgba(255,54,94,.6);
    }

    body.fail #msg {
      display: block;
    }

    #footer {

      position: fixed;

      bottom: 25px;

      font-family: 'JetBrains Mono', monospace;

      font-size: 9px;

      letter-spacing: .22em;

      color: rgba(140,210,170,.4);
    }

    #footer::before {

      content: "◆  ";

      color: var(--green);
    }

    #wrap {
      padding: 0;
    }

    #state,
    #out {
      display: none;
    }

    body.log {

      display: block;

      overflow: auto;

      padding: 20px;

      background: var(--bg);
    }

    body.log::before,
    body.log::after,
    body.log #main-container,
    body.log #footer {
      display: none;
    }

    body.log #wrap {

      display: block;

      max-width: 900px;

      margin: 0 auto;
    }

    body.log #state {

      display: block;

      margin-bottom: 12px;

      font-family: 'JetBrains Mono', monospace;

      font-size: 18px;

      font-weight: 700;

      color: var(--text);
    }

    body.log #out {

      display: block;

      max-height: calc(100vh - 100px);

      overflow-y: auto;

      padding: 16px;

      white-space: pre-wrap;

      font: 12px/1.6 'JetBrains Mono', monospace;

      color: var(--text);

      background: rgba(255,255,255,.025);

      border: 1px solid rgba(0,255,136,.15);

      border-radius: 12px;
    }

    .ok,
    .safe {
      color: var(--green);
    }

    .bad,
    .danger {
      color: var(--red);
    }

    .warn {
      color: #e3b341;
    }

    code {
      color: #72c99c;
      font-family: 'JetBrains Mono', monospace;
    }

    @keyframes reactor {

      0% {
        transform: rotate(45deg) scale(.92);
      }

      50% {
        transform: rotate(45deg) scale(1.08);
      }

      100% {
        transform: rotate(45deg) scale(.92);
      }
    }

    @keyframes diamond {

      from {
        transform: rotate(45deg) scale(.9);
        opacity: .25;
      }

      50% {
        opacity: .8;
      }

      to {
        transform: rotate(405deg) scale(1.08);
        opacity: .25;
      }
    }

    @keyframes pulseBox {

      0% {
        transform: rotate(45deg) scale(.82);
        opacity: .25;
      }

      50% {
        transform: rotate(45deg) scale(1);
        opacity: .8;
      }

      100% {
        transform: rotate(45deg) scale(.82);
        opacity: .25;
      }
    }

    @keyframes energy {

      0% {
        width: 35px;
        opacity: .15;
      }

      50% {
        width: 180px;
        opacity: 1;
      }

      100% {
        width: 35px;
        opacity: .15;
      }
    }

    @keyframes successCore {

      0% {
        transform: rotate(45deg) scale(1);
      }

      50% {
        transform: rotate(45deg) scale(1.16);
      }

      100% {
        transform: rotate(45deg) scale(1);
      }
    }

    
    #exploit-title {
      position: fixed;
      top: 22px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;

      padding: 10px 22px;
      color: var(--green);
      border: 1px solid rgba(0,255,136,.55);
      border-radius: 10px;
      background: rgba(2,12,7,.78);

      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .10em;
      text-align: center;
      white-space: nowrap;

      box-shadow:
        0 0 18px rgba(0,255,136,.12),
        inset 0 0 12px rgba(0,255,136,.04);

      text-shadow: 0 0 10px rgba(0,255,136,.5);
    }

    #credits {
      position: fixed;
      left: 50%;
      bottom: 48px;
      transform: translateX(-50%);
      z-index: 10;

      width: min(92vw, 700px);
      color: var(--green);

      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      line-height: 1.5;
      letter-spacing: .05em;
      text-align: center;

      text-shadow: 0 0 8px rgba(0,255,136,.45);
    }

    body.log #exploit-title,
    body.log #credits {
      display: none;
    }

    @media (max-width: 600px) {
      #exploit-title {
        top: 12px;
        padding: 8px 12px;
        font-size: 8px;
      }

      #credits {
        bottom: 42px;
        font-size: 8px;
        padding: 0 12px;
      }
    }

  </style>
</head>

<body>

  <div id="exploit-title">CARGA DE EXPLOIT GOLDHEN 11.00 A 13.52</div>

  <div id="main-container">

    <div id="brand">HOST:PERRUNOGT</div>

    <div id="visual-indicator">

      <div id="spin"></div>

      <div class="pulse"></div>

      <div class="core"></div>

    </div>

  </div>

  <div id="msg">Restart your console</div>

  <div id="credits">Agradecimientos a Raw game y sistro por la distribución del exploit y carga de GoldHEN</div>

  <div id="wrap">
    <div id="state"></div>
    <div id="out"></div>
  </div>

  <div id="footer">
    PERRUNOGT // GOLDHEN HOST
  </div>

  <script type="module">
    import "./jb.js?v=10";
  </script>

</body>
</html>
